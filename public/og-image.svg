<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="630" viewBox="0 0 1200 630">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#050d1a;stop-opacity:1" />
      <stop offset="60%" style="stop-color:#0a1a35;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#0d2050;stop-opacity:1" />
    </linearGradient>
    <linearGradient id="accent" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" style="stop-color:#2d5be3;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#4a7af0;stop-opacity:1" />
    </linearGradient>
    <linearGradient id="glow" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#2d5be3;stop-opacity:0.3" />
      <stop offset="100%" style="stop-color:#2d5be3;stop-opacity:0" />
    </linearGradient>
    <filter id="blur">
      <feGaussianBlur stdDeviation="40" />
    </filter>
  </defs>

  <!-- Background -->
  <rect width="1200" height="630" fill="url(#bg)" />

  <!-- Glow orb -->
  <ellipse cx="900" cy="200" rx="400" ry="300" fill="url(#glow)" filter="url(#blur)" />

  <!-- Grid lines (subtle) -->
  <g stroke="#2d5be3" stroke-width="0.5" opacity="0.08">
    <line x1="0" y1="105" x2="1200" y2="105" />
    <line x1="0" y1="210" x2="1200" y2="210" />
    <line x1="0" y1="315" x2="1200" y2="315" />
    <line x1="0" y1="420" x2="1200" y2="420" />
    <line x1="0" y1="525" x2="1200" y2="525" />
    <line x1="200" y1="0" x2="200" y2="630" />
    <line x1="400" y1="0" x2="400" y2="630" />
    <line x1="600" y1="0" x2="600" y2="630" />
    <line x1="800" y1="0" x2="800" y2="630" />
    <line x1="1000" y1="0" x2="1000" y2="630" />
  </g>

  <!-- Accent bar top -->
  <rect x="0" y="0" width="1200" height="5" fill="url(#accent)" />

  <!-- Left accent line -->
  <rect x="80" y="160" width="4" height="120" fill="url(#accent)" rx="2" />

  <!-- Main content -->
  <!-- Brand name -->
  <text x="108" y="215" font-family="'Space Grotesk', 'Inter', Arial, sans-serif" font-size="52" font-weight="700" fill="#f0f4ff" letter-spacing="-1">AeroExpert</text>
  <text x="108" y="270" font-family="'Space Grotesk', 'Inter', Arial, sans-serif" font-size="52" font-weight="700" fill="#f0f4ff" letter-spacing="-1">Consulting</text>

  <!-- Tagline -->
  <text x="108" y="320" font-family="'Inter', Arial, sans-serif" font-size="22" font-weight="400" fill="#8ba4d4" letter-spacing="0.5">Aviation Technology &amp; Digital Transformation</text>

  <!-- Divider -->
  <rect x="108" y="345" width="600" height="1" fill="#2d5be3" opacity="0.4" />

  <!-- Service pills -->
  <g font-family="'Inter', Arial, sans-serif" font-size="14" font-weight="500">
    <!-- Pill 1 -->
    <rect x="108" y="365" width="160" height="32" rx="16" fill="#2d5be3" opacity="0.2" />
    <rect x="108" y="365" width="160" height="32" rx="16" fill="none" stroke="#2d5be3" stroke-width="1" opacity="0.5" />
    <text x="188" y="386" text-anchor="middle" fill="#8ba4d4">PSS &amp; DCS Advisory</text>

    <!-- Pill 2 -->
    <rect x="280" y="365" width="170" height="32" rx="16" fill="#2d5be3" opacity="0.2" />
    <rect x="280" y="365" width="170" height="32" rx="16" fill="none" stroke="#2d5be3" stroke-width="1" opacity="0.5" />
    <text x="365" y="386" text-anchor="middle" fill="#8ba4d4">Flight Operations</text>

    <!-- Pill 3 -->
    <rect x="462" y="365" width="160" height="32" rx="16" fill="#2d5be3" opacity="0.2" />
    <rect x="462" y="365" width="160" height="32" rx="16" fill="none" stroke="#2d5be3" stroke-width="1" opacity="0.5" />
    <text x="542" y="386" text-anchor="middle" fill="#8ba4d4">Cybersecurity</text>

    <!-- Pill 4 -->
    <rect x="634" y="365" width="180" height="32" rx="16" fill="#2d5be3" opacity="0.2" />
    <rect x="634" y="365" width="180" height="32" rx="16" fill="none" stroke="#2d5be3" stroke-width="1" opacity="0.5" />
    <text x="724" y="386" text-anchor="middle" fill="#8ba4d4">Digital Transformation</text>
  </g>

  <!-- UAE badge -->
  <g>
    <rect x="108" y="430" width="130" height="28" rx="14" fill="#2d5be3" opacity="0.15" />
    <rect x="108" y="430" width="130" height="28" rx="14" fill="none" stroke="#2d5be3" stroke-width="1" opacity="0.6" />
    <text x="173" y="449" text-anchor="middle" font-family="'Inter', Arial, sans-serif" font-size="13" font-weight="600" fill="#2d5be3">UAE · Global Reach</text>
  </g>

  <!-- Domain -->
  <text x="108" y="510" font-family="'Inter', Arial, sans-serif" font-size="18" font-weight="400" fill="#4a6a9a" letter-spacing="0.5">aeroexpertconsulting.com</text>

  <!-- Decorative plane icon (right side) -->
  <g transform="translate(920, 240) rotate(-20)" opacity="0.12">
    <path d="M0,0 L120,40 L0,80 L20,40 Z" fill="#2d5be3" />
    <path d="M20,40 L80,20 L80,60 Z" fill="#4a7af0" />
  </g>

  <!-- Bottom accent bar -->
  <rect x="0" y="625" width="1200" height="5" fill="url(#accent)" />
</svg>
